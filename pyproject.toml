# Virtual uv workspace root — Python code lives in backend/ and worker/.
# `uv sync` here creates one shared .venv for both packages.

[tool.uv.workspace]
members = ["backend", "worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # long lines in payload/test literals are fine
    "B008",  # function call in default arg — the FastAPI Depends() idiom
    "UP042", # keep (str, Enum): StrEnum changes str() semantics for no benefit here
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = false
exclude = ["alembic"]
