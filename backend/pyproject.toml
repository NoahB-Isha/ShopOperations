[project]
name = "shop-ops-backend"
version = "0.1.0"
description = "Isha Life USA retail operations — API backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",  # [crypto] = cryptography, for Supabase ES256/RS256 token verify
    "openpyxl>=3.1",
    "anthropic>=0.116",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "odoo_live: contract checks that hit the real Odoo instance (read-only; skipped unless ODOO_* env is set)",
]
