<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the standalone app draw under the notch;
         safe-area padding in the shell keeps content clear of it -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Isha Life Ops</title>
    <!-- the brand flower from the iL mark -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- installable app: Add to Home Screen opens full screen, no browser nav -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Shop Ops" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfafd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131523" />

    <!-- Sets data-palette before anything paints, so switching palettes never
         flashes the default colors. Three constraints, all load-bearing:
         (1) it lives in /public rather than inline, so the CSP can stay
             `script-src 'self'` with no sha256 hash to recompute on every edit;
         (2) it must stay a CLASSIC script — type="module" or defer would run it
             after first paint;
         (3) it must stay in the document head: a blocking script in the body
             can be preceded by a paint of the head's stylesheet — one frame of
             the default palette.
         Its palette ids stay in lockstep with styles/tokens.css and
         styles/palette-lab.css. -->
    <script src="/palette.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
