<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the standalone app draw under the notch;
         safe-area padding in the shell keeps content clear of it -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Isha Life Ops</title>
    <!-- the brand flower from the iL mark -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- installable app: Add to Home Screen opens full screen, no browser nav -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Shop Ops" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfafd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131523" />
  </head>
  <body>
    <div id="root"></div>
    <!-- apply the saved palette before the bundle loads so there's no color
         flash; ids no longer offered (sunset/indigo/forest) fall back to the
         default so stale localStorage can't strand anyone -->
    <script>
      try {
        var p = localStorage.getItem("ilops_palette");
        document.documentElement.dataset.palette =
          ["pop", "neem", "turmeric"].indexOf(p) >= 0 ? p : "pop";
      } catch (e) {
        document.documentElement.dataset.palette = "pop";
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
