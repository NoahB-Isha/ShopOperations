<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isha Life Ops</title>
    <!-- the brand flower from the iL mark -->
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- apply the saved palette before the bundle loads so there's no color flash -->
    <script>
      try {
        document.documentElement.dataset.palette =
          localStorage.getItem("ilops_palette") || "sunset";
      } catch (e) {
        document.documentElement.dataset.palette = "sunset";
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
