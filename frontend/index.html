<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isha Life Ops</title>
    <!-- the brand flower from the iL mark -->
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- apply the saved palette before the bundle loads so there's no color
         flash; ids no longer offered (sunset/indigo/forest) fall back to the
         default so stale localStorage can't strand anyone -->
    <script>
      try {
        var p = localStorage.getItem("ilops_palette");
        document.documentElement.dataset.palette =
          ["pop", "neem", "turmeric"].indexOf(p) >= 0 ? p : "pop";
      } catch (e) {
        document.documentElement.dataset.palette = "pop";
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
