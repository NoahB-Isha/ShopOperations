[project]
name = "shop-ops-worker"
version = "0.1.0"
description = "Isha Life USA retail operations — background worker (Odoo sync cadence)"
requires-python = ">=3.12"
dependencies = ["shop-ops-backend"]

[tool.uv.sources]
shop-ops-backend = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
