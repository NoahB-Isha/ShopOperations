# Render Blueprint — the whole app: backend API + worker (one Docker image)
# and the frontend as a static site. Docs: https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Restore the database into Supabase FIRST (docs/DEPLOY_VERCEL_SUPABASE.md,
#      "Migrating the existing database") so the backend boots against real data.
#   2. Push this repo to GitHub.
#   3. Render Dashboard → Blueprints → "New Blueprint Instance" → pick the repo.
#   4. Fill the values Render prompts for (everything marked `sync: false`).
#      Minimum to boot: DATABASE_URL. Odoo creds enable live reads (writes stay
#      off regardless — ODOO_WRITES_ENABLED=false + per-operation flags).
#   5. After the backend is live: set VITE_API_BASE on the frontend service to
#      the backend's URL, and CORS_ORIGINS/APP_PUBLIC_URL in the env group to
#      the frontend's URL. Both redeploy automatically.
#
# Notes:
#   - CURRENTLY IN FREE-TIER TRIAL CONFIG (no card needed): backend on the
#     free plan (sleeps when idle), worker commented out (Render has no free
#     workers). Data refreshes via the Status page's "Sync now" buttons only.
#     Going live for volunteers: backend `plan: starter` + un-comment the
#     worker block ($14/mo total) — scheduled syncs, sweeps, and no cold starts.
#   - The shared env group keeps backend + worker identical (same DATABASE_URL,
#     same APP_JWT_SECRET — sessions require it).

envVarGroups:
  - name: shopops-shared
    envVars:
      # ── app ──
      - key: ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO

      # ── database ──
      # Supabase *transaction pooler* (port 6543) connection string:
      #   postgresql+psycopg://postgres.<ref>:<PASSWORD>@<host>:6543/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false

      # ── auth ──
      - key: APP_JWT_SECRET
        generateValue: true # one value for the whole group = backend and worker match
      - key: SESSION_DAYS
        value: "30"
      - key: OTP_EXP_MINUTES
        value: "10"
      # MUST be set deliberately, to "supabase" (and SUPABASE_URL /
      # SUPABASE_ANON_KEY / SUPABASE_JWT_SECRET filled in). This used to ship
      # hardcoded as "dev" on an ENV=prod service, which returns login codes in
      # the API response — anyone with the URL could sign in as anyone,
      # including admin. The app now refuses to boot with dev auth outside a
      # dev/test/local ENV, so a wrong value fails loudly instead of quietly.
      - key: AUTH_MODE
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

      # ── Odoo ──
      # Leave all four blank for fixture mode (simulator-backed, no live Odoo).
      - key: ODOO_BASE_URL
        sync: false
      - key: ODOO_DB
        sync: false
      - key: ODOO_LOGIN
        sync: false
      - key: ODOO_PASSWORD
        sync: false
      # SAFETY: stays false until the canary protocol has passed FROM THIS
      # deployment; per-operation feature flags gate each write besides.
      - key: ODOO_WRITES_ENABLED
        value: "false"
      - key: ODOO_PAGE_SIZE
        value: "1000"
      - key: ODOO_THROTTLE_SECONDS
        value: "0.25"
      - key: ODOO_TIMEOUT_SECONDS
        value: "120"
      - key: ODOO_RECORD_URL_TEMPLATE
        value: "{base}/web#id={id}&model={model}&view_type=form"

      # ── sync cadence (minutes) ──
      - key: SYNC_PRODUCTS_MINUTES
        value: "720"
      - key: SYNC_STOCK_MINUTES
        value: "240"
      - key: SYNC_SALES_MINUTES
        value: "60"
      - key: SYNC_INCOMING_MINUTES
        value: "240"
      - key: SYNC_STALE_FACTOR
        value: "2.0"
      - key: SALES_BACKFILL_MONTHS
        value: "24"

      # ── seeds / reference files ──
      # The coordinator roster carries personal data, so it is neither in the
      # repo nor in the image — and Render has no host mount to drop it on.
      # Leave this BLANK unless you have attached a Render disk holding the
      # workbook; then set the path on the disk and trigger the roster import
      # deliberately with POST /api/v1/admin/import/coordinators (admin
      # session), which reads exactly this path. Blank = no roster import.
      - key: SEED_COORDINATOR_XLSX
        sync: false

      # ── public URL (the frontend's) — notification links point here ──
      - key: APP_PUBLIC_URL
        sync: false

      # ── notifications ──
      - key: NOTIFY_ENABLED
        value: "true"
      # SMTP — blank simulates sends honestly (they log + show as SIMULATED).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: "Isha Life Shop Ops <orders@ishalife.test>"
      # WhatsApp bridge — on hold; leave blank.
      - key: WHATSAPP_BRIDGE_URL
        sync: false
      - key: WHATSAPP_BRIDGE_TOKEN
        sync: false

      # ── order-reply ingestion (worker) — blank = paste replies manually ──
      - key: IMAP_HOST
        sync: false
      - key: IMAP_USERNAME
        sync: false
      - key: IMAP_PASSWORD
        sync: false

      # ── LLM (reasonability, Q&A, email parsing) — blank = rules-only ──
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REASONABILITY_LLM_MODEL
        value: claude-opus-4-8

      # ── bot API — blank = /api/v1/bot/* returns 503 until skubot connects ──
      - key: SKUBOT_API_KEY
        sync: false

services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: shopops-backend
    runtime: docker
    region: ohio # nearest to the campus + a us-east Supabase
    dockerfilePath: infra/docker/backend.Dockerfile
    dockerContext: .
    # FREE-TIER TRIAL CONFIG: spins down after 15 min idle (~30-60s cold start
    # on the next request). Before volunteers rely on this, switch to
    # `plan: starter` ($7/mo, stays warm) and un-comment the worker below.
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - fromGroup: shopops-shared
      - key: RUN_MIGRATIONS
        value: "1" # the backend owns migrations; worker must not race it
      # The frontend's origin(s), comma-separated, scheme included, no trailing
      # slash. Example: https://shopops-frontend.onrender.com,https://shop.ishalife.com
      - key: CORS_ORIGINS
        sync: false

  # ── Background Worker (Odoo sync, notification sweeps, mailbox, digests) ──
  # COMMENTED OUT for the free-tier trial: Render has no free background
  # workers (Starter, $7/mo, is the floor). Without it the app still works —
  # data refreshes only when an admin clicks "Sync now" on the Status page,
  # and there are no scheduled sweeps/polls. Un-comment this whole block (and
  # bump the backend to `plan: starter`) when moving to the paid tier.
  #
  # - type: worker
  #   name: shopops-worker
  #   runtime: docker
  #   region: ohio
  #   dockerfilePath: infra/docker/backend.Dockerfile
  #   dockerContext: .
  #   plan: starter # workers require a paid plan
  #   # dockerCommand (not startCommand) is the Docker-runtime override. Invoked
  #   # through the entrypoint explicitly: Render's Docker command replaces
  #   # ENTRYPOINT+CMD, and the entrypoint carries the wait-for-DB step.
  #   # (RUN_MIGRATIONS=0 below keeps the worker from racing the backend's
  #   # migrations either way.)
  #   dockerCommand: /entrypoint.sh python -m worker.main
  #   envVars:
  #     - fromGroup: shopops-shared
  #     - key: RUN_MIGRATIONS
  #       value: "0"

  # ── Frontend (static) ──────────────────────────────────────────────────────
  - type: web
    name: shopops-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback so deep links like /settings load
      - type: rewrite
        source: /*
        destination: /index.html
    # HSTS and X-Content-Type-Options are already sent by Render on every
    # static site (verified live: max-age=315360000; includeSubdomains;
    # preload — stronger than anything we'd write) and are deliberately left
    # alone here rather than overridden with a weaker value. This adds only
    # what Render doesn't send by default. The frontend has no third-party
    # script/style/font hosts (fonts are bundled via @fontsource, not a CDN),
    # so 'self' covers everything except the two APIs it actually calls.
    # Keep this in lockstep with the equivalent policy in frontend/vercel.json
    # and infra/Caddyfile if either the API host or the Supabase project changes.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob:; font-src 'self';
          connect-src 'self' https://shopops-backend.onrender.com https://qevgjcetkzvppmmhylgw.supabase.co;
          worker-src 'self' blob:; manifest-src 'self'; object-src 'none';
          base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(), camera=(), microphone=()"
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The backend's public URL (https://shopops-backend[-xxxx].onrender.com).
      # Build-time only: set/changed → Render rebuilds automatically.
      - key: VITE_API_BASE
        sync: false
